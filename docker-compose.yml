name: subastaya

x-app: &app
    restart: unless-stopped
    build:
        context: .
        dockerfile: dockerfile
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
        - .:/app
        - vendor:/app/vendor
    environment:
        APP_URL: http://localhost:${APP_PORT:-8000}
        DB_CONNECTION: pgsql
        DB_DATABASE: ${DB_DATABASE:-subastaya}
        DB_USERNAME: ${DB_USERNAME:-subastaya}
        DB_PASSWORD: ${DB_PASSWORD:-subastaya_local}

services:
    laravel:
        <<: *app
        ports:
            - "127.0.0.1:${APP_PORT:-8000}:8000"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
            interval: 10s
            timeout: 5s
            retries: 12

    scheduler:
        <<: *app
        entrypoint: ["php", "artisan", "schedule:work"]
        depends_on:
            laravel:
                condition: service_healthy

    postgres:
        restart: unless-stopped
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_DATABASE:-subastaya}
            POSTGRES_USER: ${DB_USERNAME:-subastaya}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-subastaya_local}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 12

volumes:
    pgdata:
    vendor:
