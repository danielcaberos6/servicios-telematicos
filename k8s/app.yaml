apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: fotos
spec:
    accessModes: ["ReadWriteOnce"]
    storageClassName: local-path
    resources:
        requests:
            storage: 2Gi
---
# Una sola réplica: el arranque aplica migraciones y el volumen de fotos es
# ReadWriteOnce. Recreate evita dos pods a la vez durante una actualización.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: subastaya
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: subastaya
    template:
        metadata:
            labels:
                app: subastaya
        spec:
            enableServiceLinks: false
            # Kubernetes solo toma el UID de la imagen; sin runAsGroup el
            # proceso quedaría en el grupo root.
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
            initContainers:
                - name: esperar-postgres
                  image: postgres:16
                  # -U es necesario: el UID 1000 no existe en la imagen de postgres
                  # y sin usuario pg_isready no intenta conectarse.
                  command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\" -U \"$DB_USERNAME\"; do echo 'Esperando a PostgreSQL'; sleep 2; done"]
                  envFrom:
                      - configMapRef:
                            name: subastaya-config
            containers:
                - name: app
                  image: danielcaberos/subastaya
                  imagePullPolicy: IfNotPresent
                  envFrom:
                      - configMapRef:
                            name: subastaya-config
                      - secretRef:
                            name: subastaya-secret
                  ports:
                      - name: http
                        containerPort: 8000
                  # El primer arranque migra y carga los ejemplos antes de servir.
                  startupProbe:
                      httpGet:
                          path: /up
                          port: http
                      periodSeconds: 5
                      failureThreshold: 120
                  readinessProbe:
                      httpGet:
                          path: /up
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /up
                          port: http
                      periodSeconds: 20
                      timeoutSeconds: 5
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 768Mi
                  volumeMounts:
                      - name: fotos
                        mountPath: /app/storage/app/public
            volumes:
                - name: fotos
                  persistentVolumeClaim:
                      claimName: fotos
---
apiVersion: v1
kind: Service
metadata:
    name: subastaya
spec:
    type: NodePort
    selector:
        app: subastaya
    ports:
        - name: http
          port: 8000
          targetPort: http
          nodePort: 30080
