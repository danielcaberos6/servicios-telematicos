apiVersion: v1
kind: Service
metadata:
    name: postgres
spec:
    clusterIP: None
    selector:
        app: postgres
    ports:
        - name: postgres
          port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: postgres
spec:
    serviceName: postgres
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            enableServiceLinks: false
            containers:
                - name: postgres
                  image: postgres:16
                  env:
                      - name: POSTGRES_DB
                        valueFrom:
                            configMapKeyRef:
                                name: subastaya-config
                                key: DB_DATABASE
                      - name: POSTGRES_USER
                        valueFrom:
                            configMapKeyRef:
                                name: subastaya-config
                                key: DB_USERNAME
                      # Solo se aplica al crear la base; cambiarla después no
                      # modifica la contraseña guardada en el volumen.
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: subastaya-secret
                                key: DB_PASSWORD
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                  ports:
                      - name: postgres
                        containerPort: 5432
                  readinessProbe:
                      exec:
                          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
                      periodSeconds: 5
                      timeoutSeconds: 5
                  livenessProbe:
                      exec:
                          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
                      initialDelaySeconds: 30
                      periodSeconds: 20
                      timeoutSeconds: 5
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          memory: 1Gi
                  volumeMounts:
                      - name: datos
                        mountPath: /var/lib/postgresql/data
    volumeClaimTemplates:
        - metadata:
              name: datos
          spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: local-path
              resources:
                  requests:
                      storage: 5Gi
